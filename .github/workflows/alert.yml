name: Demand Qualification Alert

on:
  schedule:
    - cron: '0 12 * * *'   # 5:30 PM IST daily
  workflow_dispatch:
    inputs:
      window_start_ms:
        description: 'Window start (Unix ms) — leave blank for default 24h rolling'
        required: false
      window_end_ms:
        description: 'Window end (Unix ms) — leave blank for default 24h rolling'
        required: false

jobs:
  alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run alert
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          WINDOW_START_MS: ${{ github.event.inputs.window_start_ms }}
          WINDOW_END_MS: ${{ github.event.inputs.window_end_ms }}
        run: node alert.js

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update alert state [skip ci]"
          git push
